version: 2

models:
  - name: fct_excess_deaths_by_age
    description: "Actual vs expected deaths by age group and year. Expected = 2015-2019 linear trend per age group, scaled to each year's week count (same method as cdc_trend_analysis.py)."
    columns:
      - name: weeks_in_year
        description: "52 or 53 (2020). Expected deaths are scaled by weeks_in_year / 52."
        tests: [not_null]
      - name: death_year
        tests: [not_null]
      - name: age_group
        tests: [not_null]
      - name: expected_deaths
        description: "Trend-line expected deaths for that year."
        tests: [not_null]
      - name: excess_deaths
        description: "Actual minus expected."
      - name: r2_2015_2019
        description: "How well the 2015-2019 trend fits (1 = perfect). Low values mean the baseline is less reliable."

  - name: fct_state_65plus_excess
    description: "Deaths age 65+ vs each state's 2015-2019 trend (scaled to each year's week count), with a rank of % above trend within each year (50 states + DC)."
    columns:
      - name: weeks_in_year
        description: "52 or 53 (2020). Expected deaths are scaled by weeks_in_year / 52."
        tests: [not_null]
      - name: state_year_key
        description: "Grain: one row per state + year."
        tests: [unique, not_null]
      - name: expected_deaths
        tests: [not_null]
      - name: rank_within_year
        tests: [not_null]

  - name: mart_senior_dashboard
    description: "Source for the Tableau Public dashboard (exported to CSV). Long format: one row per year x breakdown x category. Tab 1 = 'Total 65+', tab 2 = 'Age group', tab 3 = 'State'."
    columns:
      - name: dashboard_key
        description: "Grain: breakdown | category (state_code for states) | year."
        tests: [unique, not_null]
      - name: death_year
        tests: [not_null]
      - name: breakdown
        tests:
          - not_null
          - accepted_values:
              values: ['Total 65+', 'Age group', 'State']
      - name: category
        description: "'65+', an age group ('65-74', '75-84', '85+'), or a full state name."
        tests: [not_null]
      - name: state_code
        description: "Two-letter code, set on State rows only (use as Tableau's geographic role)."
        tests:
          - not_null:
              config:
                where: "breakdown = 'State'"
      - name: actual_deaths
        tests: [not_null]
      - name: expected_deaths
        description: "2015-2019 linear trend projected to that year, scaled to its week count."
        tests: [not_null]
      - name: weeks_in_year
        description: "52 or 53 (2020). Use for the dashboard footnote on 2020."
        tests: [not_null]
      - name: excess_deaths
        tests: [not_null]
      - name: pct_above_expected
        description: "Recomputed from totals for the 65+ row; never average this column in Tableau."
        tests: [not_null]
      - name: rank_within_year
        description: "State rows only: 1 = highest % above trend that year."
        tests:
          - not_null:
              config:
                where: "breakdown = 'State'"
